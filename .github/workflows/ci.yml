name: Test and Coverage

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the Codecov upload authenticate with OIDC instead of a token.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Installing dependencies
        run: npm install

      - name: Run test
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # main is a protected branch, so Codecov rejects tokenless uploads
          # to it. OIDC needs no secret; pull requests from forks cannot get
          # an OIDC token and fall back to tokenless uploads, which Codecov
          # accepts for their unprotected branches.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          files: ./coverage/lcov.info
          # Fail the build if the upload fails on a push, so a broken upload
          # cannot silently leave the coverage badge stale.
          fail_ci_if_error: ${{ github.event_name == 'push' }}
