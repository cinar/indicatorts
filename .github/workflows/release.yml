name: Release

on:
  # Weekly patch release of whatever has landed on the default branch. The
  # check job below skips the release when nothing changed since the last tag.
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC) and provenance.
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.changes.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes since the last release
        id: changes
        run: |
          # A manual run always releases.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ] && [ -z "$(git log --oneline "$LATEST_TAG"..HEAD)" ]; then
            echo "No commits since $LATEST_TAG, skipping the release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # npm trusted publishing requires npm 11.5.1 or later.
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted and staged publishing
        run: npm install -g npm@^11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package entry points exist
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");
            for (const field of ["main", "module", "types"]) {
              if (!fs.existsSync(pkg[field])) {
                console.error(`package.json ${field} (${pkg[field]}) does not exist`);
                process.exit(1);
              }
            }
          '

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: bump
        run: |
          # Scheduled runs have no inputs and release a patch version.
          NEW_VERSION=$(npm version "${{ inputs.bump || 'patch' }}" -m "Release v%s")
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Stage before pushing, so a failed upload leaves nothing pushed and
      # the workflow can simply be run again. The trusted publisher only
      # allows staging: a maintainer must approve the staged version with
      # 2FA (on npmjs.com, or `npm stage approve <stage-id>`) before it is
      # published.
      - name: Stage npm publish
        run: npm stage publish . --provenance --access public

      - name: Push commit and tag
        run: git push origin HEAD:${{ github.event.repository.default_branch }} --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes
